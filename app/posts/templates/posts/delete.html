{% extends "base.html" %}

{% block content %}
<div class="card text-center shadow-sm border-danger">
  <div class="card-header bg-danger text-white">
    Підтвердження видалення
  </div>
  <div class="card-body">
    <h5 class="card-title">Ви впевнені, що хочете видалити цей пост?</h5>
    <p class="card-text">"{{ post.title }}"</p>
    <p class="text-muted">Цю дію неможливо буде скасувати.</p>
    
    <form action="{{ url_for('posts.delete', id=post.id) }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-danger">Так, видалити</button>
      <a href="{{ url_for('posts.post_detail', id=post.id) }}" class="btn btn-secondary">Скасувати</a>
    </form>
  </div>
</div>
{% endblock %}
